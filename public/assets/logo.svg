<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
    <defs>
        <!-- Background Shield Gradient -->
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2e0854" />
            <stop offset="50%" stop-color="#19062e" />
            <stop offset="100%" stop-color="#090214" />
        </linearGradient>

        <!-- Outer Border Glow Gradient -->
        <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="25%" stop-color="#c084fc" />
            <stop offset="70%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>

        <!-- Crown Gold Gradient -->
        <linearGradient id="goldCrown" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="30%" stop-color="#f59e0b" />
            <stop offset="70%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#78350f" />
        </linearGradient>

        <!-- Cross Neon Gradient -->
        <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="30%" stop-color="#e9d5ff" />
            <stop offset="70%" stop-color="#c084fc" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>

        <!-- Glow filter -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Outer Shadow Layer -->
    <path d="M100 24 C142 24 172 44 172 88 C172 136 128 174 100 188 C72 174 28 136 28 88 C28 44 58 24 100 24 Z" 
          fill="#000000" opacity="0.35" transform="translate(0, 4)" />

    <!-- Main Shield Body -->
    <path d="M100 24 C142 24 172 44 172 88 C172 136 128 174 100 188 C72 174 28 136 28 88 C28 44 58 24 100 24 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#borderGlow)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Inner Shield Accent Rim -->
    <path d="M100 32 C136 32 162 49 162 88 C162 130 124 164 100 176 C76 164 38 130 38 88 C38 49 64 32 100 32 Z" 
          fill="none" 
          stroke="#a855f7" 
          stroke-width="1.5" 
          stroke-dasharray="6 3"
          opacity="0.5" />

    <!-- Prison Bars Graphic Pattern in Shield -->
    <g opacity="0.18" stroke="#c084fc" stroke-width="2">
        <line x1="60" y1="42" x2="60" y2="140" />
        <line x1="80" y1="36" x2="80" y2="160" />
        <line x1="100" y1="34" x2="100" y2="168" />
        <line x1="120" y1="36" x2="120" y2="160" />
        <line x1="140" y1="42" x2="140" y2="140" />
    </g>

    <!-- Center Medical/Clinic Cross -->
    <g filter="url(#neonGlow)">
        <!-- Horizontal bar -->
        <rect x="58" y="94" width="84" height="26" rx="6" fill="url(#crossGrad)" />
        <!-- Vertical bar -->
        <rect x="87" y="65" width="26" height="84" rx="6" fill="url(#crossGrad)" />
        
        <!-- Cross Highlight Inset -->
        <rect x="62" y="98" width="76" height="18" rx="4" fill="#ffffff" opacity="0.35" />
        <rect x="91" y="69" width="18" height="76" rx="4" fill="#ffffff" opacity="0.35" />
    </g>

    <!-- Royal Clinic Crown on Top -->
    <g filter="url(#neonGlow)">
        <!-- Crown base and spikes -->
        <path d="M56 46 L68 18 L86 34 L100 10 L114 34 L132 18 L144 46 Z" 
              fill="url(#goldCrown)" 
              stroke="#fef08a" 
              stroke-width="2.5" 
              stroke-linejoin="round" />

        <!-- Crown base trim -->
        <rect x="54" y="44" width="92" height="7" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />

        <!-- Crown jewels / diamonds -->
        <circle cx="100" cy="10" r="3" fill="#ffffff" stroke="#f59e0b" stroke-width="1" />
        <circle cx="68" cy="18" r="2.5" fill="#ffffff" stroke="#f59e0b" stroke-width="1" />
        <circle cx="132" cy="18" r="2.5" fill="#ffffff" stroke="#f59e0b" stroke-width="1" />
        <circle cx="100" cy="47.5" r="2" fill="#a855f7" />
        <circle cx="78" cy="47.5" r="2" fill="#ef4444" />
        <circle cx="122" cy="47.5" r="2" fill="#ef4444" />
    </g>

    <!-- Sparkle Stars -->
    <path d="M142 76 Q144 82 150 84 Q144 86 142 92 Q140 86 134 84 Q140 82 142 76 Z" fill="#fef08a" opacity="0.85" />
    <path d="M58 126 Q60 130 64 132 Q60 134 58 138 Q56 134 52 132 Q56 130 58 126 Z" fill="#fef08a" opacity="0.7" />
</svg>
