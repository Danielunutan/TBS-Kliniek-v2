<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" fill="none">
    <defs>
        <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2e0854" />
            <stop offset="50%" stop-color="#19062e" />
            <stop offset="100%" stop-color="#090214" />
        </linearGradient>
        <linearGradient id="borderGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="25%" stop-color="#c084fc" />
            <stop offset="70%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <linearGradient id="goldCrown2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="30%" stop-color="#f59e0b" />
            <stop offset="70%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#78350f" />
        </linearGradient>
        <linearGradient id="crossGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="30%" stop-color="#e9d5ff" />
            <stop offset="70%" stop-color="#c084fc" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#581c87" />
            <stop offset="50%" stop-color="#7e22ce" />
            <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>
        <filter id="neonGlow2" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Emblem scaled on Left -->
    <g transform="translate(6, 6) scale(0.54)">
        <path d="M100 24 C142 24 172 44 172 88 C172 136 128 174 100 188 C72 174 28 136 28 88 C28 44 58 24 100 24 Z" 
              fill="url(#shieldGrad2)" 
              stroke="url(#borderGlow2)" 
              stroke-width="5" 
              stroke-linejoin="round" />
        <g opacity="0.2" stroke="#c084fc" stroke-width="2">
            <line x1="60" y1="42" x2="60" y2="140" />
            <line x1="80" y1="36" x2="80" y2="160" />
            <line x1="100" y1="34" x2="100" y2="168" />
            <line x1="120" y1="36" x2="120" y2="160" />
            <line x1="140" y1="42" x2="140" y2="140" />
        </g>
        <g filter="url(#neonGlow2)">
            <rect x="58" y="94" width="84" height="26" rx="6" fill="url(#crossGrad2)" />
            <rect x="87" y="65" width="26" height="84" rx="6" fill="url(#crossGrad2)" />
            <rect x="62" y="98" width="76" height="18" rx="4" fill="#ffffff" opacity="0.35" />
            <rect x="91" y="69" width="18" height="76" rx="4" fill="#ffffff" opacity="0.35" />
        </g>
        <g filter="url(#neonGlow2)">
            <path d="M56 46 L68 18 L86 34 L100 10 L114 34 L132 18 L144 46 Z" 
                  fill="url(#goldCrown2)" 
                  stroke="#fef08a" 
                  stroke-width="2.5" 
                  stroke-linejoin="round" />
            <rect x="54" y="44" width="92" height="7" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
            <circle cx="100" cy="10" r="3" fill="#ffffff" stroke="#f59e0b" stroke-width="1" />
            <circle cx="68" cy="18" r="2.5" fill="#ffffff" stroke="#f59e0b" stroke-width="1" />
            <circle cx="132" cy="18" r="2.5" fill="#ffffff" stroke="#f59e0b" stroke-width="1" />
        </g>
    </g>

    <!-- Brand Typography on Right -->
    <g transform="translate(130, 20)">
        <!-- Badge -->
        <rect x="0" y="2" width="72" height="18" rx="5" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1" />
        <text x="36" y="14.5" fill="#7e22ce" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="900" letter-spacing="1" text-anchor="middle">OFFICIEEL</text>

        <!-- Main Title -->
        <text x="0" y="48" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">TBS <tspan fill="url(#textGrad)">KLINIEK</tspan></text>
        
        <!-- Slogan / Tagline -->
        <text x="0" y="68" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">VRIJHEID MOET JE BEVECHTEN</text>
    </g>
</svg>
